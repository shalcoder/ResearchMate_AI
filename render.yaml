services:
  # -------------------------------------------------------------
  # ResearchMate AI FastAPI Backend Web Service
  # -------------------------------------------------------------
  - type: web
    name: researchmate-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r backend/requirements.txt
    startCommand: python -m uvicorn main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: researchmate-postgres
          property: connectionString
      - key: BACKEND_CORS_ORIGINS
        value: "http://localhost:3000,https://*.vercel.app,https://*.github.io"
      - key: UPLOAD_DIR
        value: ./uploads
      - key: CHROMA_PERSIST_DIR
        value: ./chroma_db
      - key: GEMINI_API_KEY
        sync: false # Set securely in Render dashboard

# -------------------------------------------------------------
# Managed PostgreSQL Database for ResearchMate AI
# -------------------------------------------------------------
databases:
  - name: researchmate-postgres
    databaseName: researchmate_db
    user: researchmate_user
    region: oregon
    plan: free
